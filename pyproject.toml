[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-gateway"
version = "1.1.0"
description = "Async Telegram gateway for live queues and bounded historical retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "telethon==1.45.0",
    "ftfy>=6.0",
    "emoji>=2.1.0",
    "python-ulid>=3.1.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
smoke = ["python-dotenv>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["telegram_gateway*"]
